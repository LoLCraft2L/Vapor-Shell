name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: pwsh
        run: |
          if (Test-Path ./scripts/build.ps1) {
            & ./scripts/build.ps1
          } else {
            pyinstaller vapor.spec --noconfirm
          }

      - name: Zip as Vapor-win64.zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter Vapor.exe | Select-Object -First 1
          if (-not $exe) { throw "Vapor.exe not found in dist" }
          $src = $exe.Directory.FullName
          Write-Host "Zipping contents of $src"
          Get-ChildItem $src | Select-Object Name
          if (Test-Path Vapor-win64.zip) { Remove-Item Vapor-win64.zip }
          Compress-Archive -Path "$src\*" -DestinationPath Vapor-win64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vapor-win64
          path: Vapor-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Vapor-win64.zip
          generate_release_notes: true