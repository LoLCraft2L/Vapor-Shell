# Builds Vapor, Harmony and Synapse on GitHub and attaches the zips to the release.
# Put this file at  .github/workflows/release.yml  and release with a tag:
#   git tag v0.1.4
#   git push origin v0.1.4
# The tag becomes the version (scripts/build.ps1 stamps it into vaporctl.py). Harmony.pyw and Synapse.pyw have to be in the repo root.
# Run it by hand from the Actions tab to test: the zips then show up as a download on the run instead of a release.
name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write            # needed to attach files to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the build reads the version from the git tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Vapor, Harmony and Synapse
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Keep the zips on the run (for manual test builds)
        uses: actions/upload-artifact@v4
        with:
          name: vapor-zips
          path: dist/*-win64.zip

      - name: Attach the zips to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Vapor-win64.zip
            dist/Harmony-win64.zip
            dist/Synapse-win64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
